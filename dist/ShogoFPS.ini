; ShogoFPS settings (keep next to ShogoFPS.asi)
; 1 = on, 0 = off

[ShogoFPS]
; Keeps the world (AI, projectiles, doors, cutscenes) at real speed
; whatever the frame rate. Set to 0 while recording a demo.
ServerTickFix=1

; Smooth mouse aim above 64 fps (1 ms input clock).
; Needs TimerResolution=1.
MouseFix=1

; Asks Windows for a 1 ms timer for the game.
TimerResolution=1

; Minimum time between two world updates, in ms: 10 to 100.
; 10 = the engine's own value (recommended). Below 10, 10 applies.
MinTickMs=10

; How far the mouse clock stays behind Windows' clock, in ms: 16 to 64.
MouseLagMs=20

; 1 = change nothing in the game, only measure (to compare before/after).
DiagnoseOnly=0

; 1 = refuse to activate at the slightest doubt during detection.
Strict=0

; ShogoFPS.log, with statistics every N seconds (5 minimum).
; LogDir empty = next to ShogoFPS.asi. Otherwise any folder, created if
; missing, for example: LogDir=D:\Games\ShogoFPS\logs
Log=1
LogDir=
StatsInterval=30
