; ShogoFPS - réglages (à placer à côté de ShogoFPS.asi)
; 1 = activé, 0 = désactivé

[ShogoFPS]
; Garde le monde (IA, projectiles, portes, cinématiques) à vitesse réelle
; quel que soit le nombre d'images par seconde.
; Mettre 0 le temps d'enregistrer une démo.
ServerTickFix=1

; Visée souris fluide au-dessus de 64 FPS (horloge d'entrée à 1 ms).
; Nécessite TimerResolution=1.
MouseFix=1

; Demande à Windows un minuteur à 1 ms pour le jeu.
TimerResolution=1

; Intervalle minimum entre deux mises à jour du monde, en ms : 10 à 100.
; 10 = valeur du moteur (recommandé). En dessous de 10, 10 s'applique.
MinTickMs=10

; Retard de l'horloge souris sur l'horloge Windows, en ms : 16 à 64.
MouseLagMs=20

; 1 = ne change rien au jeu, mesure seulement (pour comparer avant/après).
DiagnoseOnly=0

; 1 = refuse de s'activer au moindre doute lors de la détection.
Strict=0

; Journal ShogoFPS.log, statistiques toutes les N secondes (5 minimum).
Log=1
StatsInterval=30
